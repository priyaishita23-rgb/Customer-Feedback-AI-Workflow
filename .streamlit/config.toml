# The page (prototype/index.html) has its own white + sage theme and dark-mode toggle, and repaints
# the app around it to match. This keeps Streamlit's own frame white while the page loads.
[theme]
base = "light"
primaryColor = "#4E6E50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F1"
textColor = "#1E2A21"

[client]
toolbarMode = "minimal"
